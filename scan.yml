name: NSE scanner

# One job per trading day that loops internally every 5 minutes.
# It only needs ONE trigger per day (plus a backup), instead of GitHub's
# unreliable "every 5 minutes" schedule.
# The alert log (alert_log.csv, alert_outcomes.csv) is saved back to the repo.

on:
  schedule:
    - cron: '57 3 * * 1-5'   # 09:27 IST, main start
    - cron: '35 4 * * 1-5'   # 10:05 IST, backup start (harmless if already running)
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification only (true/false)'
        default: 'false'
      refresh:
        description: 'Run one full watchlist refresh now (true/false)'
        default: 'false'
      summary:
        description: 'Score today''s alerts and send the summary now (true/false)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: ${{ (github.event.inputs.test == 'true' && 'scanner-test') || (github.event.inputs.summary == 'true' && 'scanner-summary') || 'scanner' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore alert history and watchlist
        uses: actions/cache@v4
        with:
          path: |
            state.json
            watchlist.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event.inputs.test }}
          SUMMARY: ${{ github.event.inputs.summary }}
          FORCE_REFRESH: ${{ github.event.inputs.refresh == 'true' && '1' || '0' }}
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"

          # Save the alert log files to the repo so they survive between days
          save_log() {
            for f in alert_log.csv alert_outcomes.csv; do
              [ -f "$f" ] && git add "$f"
            done
            if ! git diff --cached --quiet; then
              git commit -q -m "Update alert log" \
                && git pull -q --rebase origin "$GITHUB_REF_NAME" \
                && git push -q origin "HEAD:$GITHUB_REF_NAME" \
                || { echo "Could not save the log to the repo"; git rebase --abort 2>/dev/null || true; }
            fi
          }

          # Manual buttons: summary only
          if [ "$SUMMARY" = "true" ]; then
            python alert_bot.py summary
            save_log
            exit 0
          fi

          # Manual buttons: one test message or one refresh
          if [ "$TEST" = "true" ] || [ "$FORCE_REFRESH" = "1" ]; then
            python alert_bot.py
            save_log
            exit 0
          fi

          # If the job started a little early, wait for the 09:30 IST open (04:00 UTC)
          OPEN=$(date -u -d "04:00" +%s)
          GAP=$((OPEN - $(date +%s)))
          if [ "$GAP" -gt 0 ] && [ "$GAP" -lt 1800 ]; then
            echo "Waiting ${GAP}s for the market open"
            sleep "$GAP"
          fi

          # Then loop every 5 minutes until 15:15 IST (09:45 UTC)
          END=$(date -u -d "09:45" +%s)
          echo "Loop started $(date -u). Stops at $(date -u -d @"$END")."
          while [ "$(date +%s)" -lt "$END" ]; do
            START=$(date +%s)
            python alert_bot.py || echo "scan failed, continuing"
            save_log
            WAIT=$((300 - ($(date +%s) - START)))
            if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
          done
          echo "Loop finished $(date -u)."

          # Daily summary (short pause so the final candles are available)
          sleep 150
          python alert_bot.py summary || echo "summary failed"
          save_log
