name: NSE scanner

on:
  schedule:
    # Every 5 minutes, 04:00-09:55 UTC = 09:30-15:25 IST, Mon-Fri
    - cron: '*/5 4-9 * * 1-5'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a Telegram test message only (true/false)'
        default: 'false'

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore alert history (avoids duplicate alerts)
        uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run scanner
        run: python alert_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event.inputs.test }}
