name: NSE scanner

on:
  schedule:
    # Every 5 minutes, 04:00-09:55 UTC = 09:30-15:25 IST, Mon-Fri
    - cron: '*/5 4-9 * * 1-5'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification only (true/false)'
        default: 'false'
      refresh:
        description: 'Force a full watchlist refresh now (true/false)'
        default: 'false'

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore alert history and watchlist
        uses: actions/cache@v4
        with:
          path: |
            state.json
            watchlist.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run scanner
        run: python alert_bot.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event.inputs.test }}
          FORCE_REFRESH: ${{ github.event.inputs.refresh == 'true' && '1' || '0' }}
